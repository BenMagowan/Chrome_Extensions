<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sumbreak Mock</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f4f2ee;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1f1f1f;
      }
      .sb-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 345px;
        font-size: 14px;
        font-weight: 600;
        color: #555;
      }
      .sb-board {
        position: relative;
        width: 345px;
        height: 345px;
        background: #ffffff;
        border-radius: 16px;
        padding: 0;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        user-select: none;
        touch-action: none;
      }
      .sb-cell {
        position: absolute;
        left: var(--sb-left);
        top: var(--sb-top);
        width: var(--sb-width);
        height: var(--sb-height);
      }
      .sb-btn {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        padding: 0;
        border: none;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
        outline: none;
        z-index: 2;
      }
      .sb-btn[aria-pressed="true"] {
        box-shadow: inset 0 0 0 3px #191919, 0 0 0 2px #ffffff;
      }
      .sb-btn[disabled] {
        cursor: default;
      }
      .sb-scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }
      .sb-tile-rect {
        fill: var(--aaanih, #d9d9d9);
        stroke: var(--aaanii, #888888);
        stroke-width: 2;
      }
      .sb-tile-label {
        fill: var(--aaanij, #1f1f1f);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 700;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .sb-empty-dot {
        fill: #dfdcd6;
      }
    </style>
  </head>
  <body>
    <div class="sb-header">
      <span>Sumbreak Mock</span>
      <span id="sb-status"></span>
    </div>
    <div id="mount"></div>

    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const inputMode = params.get("input") === "drag" ? "drag" : "tap";
        const rawVals = params.get("values");
        const values = rawVals
          ? rawVals.split(",").map((s) => parseInt(s.trim(), 10) || 0)
          : [1, 1, 64, 4, 2, 32, 4, 4, 16];

        let rows = parseInt(params.get("rows") || "", 10);
        let cols = parseInt(params.get("cols") || "", 10);
        if (!Number.isFinite(rows) || !Number.isFinite(cols)) {
          const n = Math.round(Math.sqrt(values.length));
          rows = n;
          cols = n;
        }
        while (values.length < rows * cols) values.push(0);

        // Tile palettes extracted directly from the LinkedIn Sumbreak fixtures.
        const PALETTE = {
          1: { bg: "#98A4FF", border: "#403899", text: "#2C3689", hi: "#D4CCFF" },
          2: { bg: "#67C3FF", border: "#355181", text: "#004D7F", hi: "#CBE6FF" },
          4: { bg: "#36DBFF", border: "#406D7F", text: "#005D71", hi: "#C8F1FF" },
          8: { bg: "#4CE8C0", border: "#2F7563", text: "#00604A", hi: "#C7FAED" },
          16: { bg: "#A3F19A", border: "#4D7343", text: "#127207", hi: "#D8F6D4" },
          32: { bg: "#DAE471", border: "#697136", text: "#5F6600", hi: "#F0F7BF" },
          64: { bg: "#F5D45F", border: "#796B2E", text: "#6E5C00", hi: "#FFF1B5" },
          128: { bg: "#FFB561", border: "#7E5F29", text: "#7C4200", hi: "#FFE2B5" },
          256: { bg: "#FF8F75", border: "#7D3F31", text: "#752212", hi: "#FFD5CB" },
          512: { bg: "#FF709A", border: "#7A2D46", text: "#700F30", hi: "#FFC7D8" },
          1024: { bg: "#DC82FF", border: "#63327A", text: "#531470", hi: "#F0CEFF" },
          2048: { bg: "#9C8CFF", border: "#443A82", text: "#2D2175", hi: "#DDD6FF" },
        };

        function styleFor(val) {
          return (
            PALETTE[val] || {
              bg: "#FFB561",
              border: "#7E5F29",
              text: "#7C4200",
              hi: "#FFE2B5",
            }
          );
        }

        const BOARD_SIZE = 345;
        const GAP = 12;
        const cellW = (BOARD_SIZE - GAP * (cols - 1)) / cols;
        const cellH = (BOARD_SIZE - GAP * (rows - 1)) / rows;

        const board = document.createElement("div");
        board.className = "sb-board";
        board.setAttribute("data-numo-design", "tiles");
        board.setAttribute("data-numo-rows", String(rows));
        board.setAttribute("data-numo-columns", String(cols));
        board.setAttribute("role", "group");
        board.setAttribute("tabindex", "-1");
        board.setAttribute("aria-label", "Gameboard");
        board.style.setProperty("--aaamxv", `${BOARD_SIZE} / ${BOARD_SIZE}`);
        if (inputMode === "drag") {
          board.setAttribute("data-numo-input-mode", "pointer");
        }
        document.getElementById("mount").appendChild(board);

        let selectedIdx = null;
        let dragFromIdx = null;
        let dragDownX = 0;
        let dragDownY = 0;
        let dragMoved = false;

        function isOrthogonal(a, b) {
          const ra = Math.floor(a / cols),
            ca = a % cols;
          const rb = Math.floor(b / cols),
            cb = b % cols;
          return Math.abs(ra - rb) + Math.abs(ca - cb) === 1;
        }

        function tileCount() {
          let c = 0;
          for (const v of values) if (v > 0) c++;
          return c;
        }

        function tryMerge(fromIdx, toIdx) {
          if (fromIdx === null || toIdx === null || fromIdx === toIdx) return false;
          if (values[fromIdx] <= 0 || values[toIdx] <= 0) return false;
          if (values[fromIdx] !== values[toIdx]) return false;
          if (!isOrthogonal(fromIdx, toIdx)) return false;
          values[toIdx] = values[toIdx] * 2;
          values[fromIdx] = 0;
          selectedIdx = null;
          render();
          return true;
        }

        const SVG_NS = "http://www.w3.org/2000/svg";

        function render() {
          const remaining = tileCount();
          const solved = remaining === 1;
          document.getElementById("sb-status").textContent =
            `${rows}x${cols} • ${inputMode} • ${solved ? "Solved" : remaining + " tiles"}`;

          board.innerHTML = "";

          for (let i = 0; i < rows * cols; i++) {
            const r = Math.floor(i / cols);
            const c = i % cols;
            const x = c * (cellW + GAP);
            const y = r * (cellH + GAP);

            const cell = document.createElement("div");
            cell.className = "sb-cell";
            cell.setAttribute("data-numo-index", String(i));
            cell.style.setProperty("--sb-left", `${(x / BOARD_SIZE) * 100}%`);
            cell.style.setProperty("--sb-top", `${(y / BOARD_SIZE) * 100}%`);
            cell.style.setProperty("--sb-width", `${(cellW / BOARD_SIZE) * 100}%`);
            cell.style.setProperty("--sb-height", `${(cellH / BOARD_SIZE) * 100}%`);

            if (values[i] > 0) {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "sb-btn";
              btn.setAttribute("data-numo-kind", "number");
              btn.setAttribute(
                "aria-label",
                `Number ${values[i]}, row ${r + 1}, column ${c + 1}`
              );
              btn.setAttribute(
                "aria-pressed",
                selectedIdx === i ? "true" : "false"
              );
              if (solved) btn.setAttribute("disabled", "");

              if (inputMode === "tap") {
                btn.addEventListener("click", () => {
                  if (solved) return;
                  if (selectedIdx === null) {
                    selectedIdx = i;
                    render();
                  } else if (selectedIdx === i) {
                    selectedIdx = null;
                    render();
                  } else if (!tryMerge(selectedIdx, i)) {
                    selectedIdx = i;
                    render();
                  }
                });
              }

              cell.appendChild(btn);
            }

            board.appendChild(cell);
          }

          const svg = document.createElementNS(SVG_NS, "svg");
          svg.setAttribute("class", "sb-scene");
          svg.setAttribute("data-numo-scene", "true");
          svg.setAttribute("viewBox", `0 0 ${BOARD_SIZE} ${BOARD_SIZE}`);
          svg.setAttribute("preserveAspectRatio", "none");
          svg.setAttribute("aria-hidden", "true");
          svg.setAttribute("focusable", "false");

          for (let i = 0; i < rows * cols; i++) {
            const r = Math.floor(i / cols);
            const c = i % cols;
            const x = c * (cellW + GAP);
            const y = r * (cellH + GAP);
            const cx = x + cellW / 2;
            const cy = y + cellH / 2;

            const g = document.createElementNS(SVG_NS, "g");
            g.setAttribute("data-numo-svg-cell", String(i));

            if (values[i] > 0) {
              const p = styleFor(values[i]);
              const paint = document.createElementNS(SVG_NS, "g");
              paint.setAttribute("data-numo-paint-cell", String(i));
              paint.setAttribute("data-numo-paint-role", "resting");
              paint.setAttribute(
                "style",
                `--aaanih: ${p.bg}; --aaanii: ${p.border}; --aaanij: ${p.text}; --aaanik: ${p.hi};`
              );

              const rect = document.createElementNS(SVG_NS, "rect");
              rect.setAttribute("class", "sb-tile-rect");
              rect.setAttribute("x", String(x));
              rect.setAttribute("y", String(y));
              rect.setAttribute("width", String(cellW));
              rect.setAttribute("height", String(cellH));
              rect.setAttribute("rx", "8");

              const text = document.createElementNS(SVG_NS, "text");
              text.setAttribute("class", "sb-tile-label");
              text.setAttribute("data-numo-label", "true");
              text.setAttribute("x", String(cx));
              text.setAttribute("y", String(cy));
              text.setAttribute("font-size", rows >= 5 ? "15" : "18");
              text.setAttribute("opacity", "1");
              text.textContent = String(values[i]);

              paint.appendChild(rect);
              paint.appendChild(text);
              g.appendChild(paint);
            } else {
              g.setAttribute("data-numo-empty-cell", String(i));
              const dot = document.createElementNS(SVG_NS, "circle");
              dot.setAttribute("class", "sb-empty-dot");
              dot.setAttribute("cx", String(cx));
              dot.setAttribute("cy", String(cy));
              dot.setAttribute("r", rows >= 5 ? "8" : "12");
              g.appendChild(dot);
            }

            svg.appendChild(g);
          }

          board.appendChild(svg);
        }

        if (inputMode === "drag") {
          board.addEventListener("pointerdown", (ev) => {
            if (tileCount() === 1) return;
            const cell = ev.target && ev.target.closest("[data-numo-index]");
            if (!cell) return;
            const idx = parseInt(cell.getAttribute("data-numo-index"), 10);
            if (values[idx] > 0) {
              dragFromIdx = idx;
              dragDownX = ev.clientX;
              dragDownY = ev.clientY;
              dragMoved = false;
            }
          });

          document.addEventListener("pointermove", (ev) => {
            if (dragFromIdx === null) return;
            if (
              Math.hypot(ev.clientX - dragDownX, ev.clientY - dragDownY) >= 4
            ) {
              dragMoved = true;
            }
          });

          document.addEventListener("pointerup", (ev) => {
            if (dragFromIdx === null) return;
            const from = dragFromIdx;
            const moved = dragMoved;
            dragFromIdx = null;
            dragMoved = false;
            if (!moved) return;
            const el = document.elementFromPoint(ev.clientX, ev.clientY);
            const cell = el && el.closest("[data-numo-index]");
            if (!cell) return;
            const to = parseInt(cell.getAttribute("data-numo-index"), 10);
            tryMerge(from, to);
          });
        }

        render();
      })();
    </script>
  </body>
</html>
